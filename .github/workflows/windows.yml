name: Windows

on:
  workflow_dispatch:

jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v6

      - name: Install WiX Toolset
        run: |
          choco install wixtoolset --no-progress -y
          Add-Content $env:GITHUB_PATH "${env:ProgramFiles(x86)}\WiX Toolset v3.14\bin"

      - name: Package
        run: ./gradlew :desktopApp:packageReleaseMsi

      - uses: actions/upload-artifact@v7
        with:
          name: citrinScore-windows
          path: desktopApp/build/compose/binaries/main-release/msi/*.msi
          retention-days: 7
          if-no-files-found: error
